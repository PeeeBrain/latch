[package]
name = "latch-desktop"
version = "0.2.6"
edition = "2024"
license = "MIT"
publish = false

[package.metadata.packager]
product-name = "Latch"
identifier = "com.latch.passwordmanager"
publisher = "Latch"
description = "Local encrypted password manager"
homepage = "https://github.com/PeeeBrain/latch"
out-dir = "../../target/native-packages"
icons = ["../../frontend/src-tauri/icons/icon.png", "../../frontend/src-tauri/icons/icon.ico", "../../frontend/src-tauri/icons/icon.icns"]

[dependencies]
gpui-kit = { version = "=0.7.0", default-features = false }
latch-core = { path = "../latch-core" }
zeroize = "1.7"
unicode-segmentation = "1.12"
hex = "0.4"
url = "2.5"
uuid = { version = "1", features = ["v4"] }
serde_json = { version = "1", features = ["preserve_order"] }
jsonc-parser = { version = "0.33", features = ["serde"] }
tempfile = "3"
raw-window-handle = "0.6"
tokio = { version = "1", features = ["rt", "time"] }
global-hotkey = "0.8"
cargo-packager-updater = "=0.2.3"
semver = "1"
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Storage_Streams", "Security_Credentials", "Security_Credentials_UI", "Security_Cryptography_Core", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = "0.3"
objc2-security = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = "0.3"

[dev-dependencies]
gpui-kit = { version = "=0.7.0", default-features = false, features = ["test-support"] }
