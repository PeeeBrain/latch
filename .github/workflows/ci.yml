name: CI

on:
  workflow_dispatch:
    inputs:
      package:
        description: Also generate unsigned installers
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
      packages: ${{ steps.filter.outputs.packages }}
      tooling: ${{ steps.filter.outputs.tooling }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          base: ${{ github.ref }}
          filters: .github/ci-filters.yml

  workflows:
    name: Workflow validation
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflows == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - name: Check workflows with pinned actionlint
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  release-tooling:
    name: Release tooling
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.tooling == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Release contract tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  native:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.native == 'true' || needs.changes.outputs.packages == 'true'
    uses: ./.github/workflows/native-package.yml
    with:
      package: ${{ inputs.package == true || (github.event_name != 'workflow_dispatch' && needs.changes.outputs.packages == 'true') }}
      save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  status:
    name: CI status
    needs: [changes, workflows, release-tooling, native]
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Require successful checks or intentional skips
        env:
          CHANGES: ${{ needs.changes.result }}
          WORKFLOWS: ${{ needs.workflows.result }}
          TOOLING: ${{ needs.release-tooling.result }}
          NATIVE: ${{ needs.native.result }}
        run: |
          test "$CHANGES" = success
          for result in "$WORKFLOWS" "$TOOLING" "$NATIVE"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
