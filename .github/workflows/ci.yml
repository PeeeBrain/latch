name: CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend Checks
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Install dependencies
        working-directory: ./frontend
        run: bun ci

      - name: TypeScript type check
        working-directory: ./frontend
        run: bun run typecheck

      - name: ESLint check
        working-directory: ./frontend
        run: bun run lint

      - name: Frontend tests
        working-directory: ./frontend
        run: bun run test

      - name: Build frontend
        working-directory: ./frontend
        run: bun run build

  backend:
    name: Backend Checks
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'frontend/src-tauri -> target'

      - name: Check code formatting
        working-directory: ./frontend/src-tauri
        run: cargo fmt --all -- --check

      - name: Run cargo check, test, and clippy
        working-directory: ./frontend/src-tauri
        env:
          LATCH_OAUTH_SECRET: ${{ secrets.CI_LATCH_OAUTH_SECRET }}
        run: |
          cargo check --all-targets --locked
          cargo test --all-targets --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings
        # NOTE: CI_LATCH_OAUTH_SECRET must be set as a GitHub Secret with >= 32 random bytes
        # Generate with: openssl rand -hex 32
