name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/**'
      - 'scripts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  release-tooling:
    name: Release tooling
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Release contract tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  native:
    name: Native Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-windows-2025, blacksmith-6vcpu-macos-latest, blacksmith-4vcpu-ubuntu-2404]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libfontconfig1-dev libfreetype-dev libssl-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libx11-xcb-dev libgtk-3-dev libayatana-appindicator3-dev
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: native-release
      - name: Check formatting
        run: cargo fmt -p latch-core -p latch-desktop -- --check
      - name: Check native application
        run: cargo check -p latch-desktop --all-targets --locked
      - name: Core tests without legacy OAuth
        run: cargo test -p latch-core --locked
      - name: Native flow tests
        run: cargo test -p latch-desktop --locked
      - name: Historical vault compatibility tests
        run: cargo test -p latch-core --features legacy-oauth --locked
      - name: Strict Clippy
        run: cargo clippy -p latch-core -p latch-desktop --all-targets --locked -- -D warnings
      - name: Strict compatibility Clippy
        run: cargo clippy -p latch-core --all-targets --all-features --locked -- -D warnings
      - name: Build review executable on CI
        run: cargo build -p latch-desktop --release --locked
      - name: Upload review executable
        uses: actions/upload-artifact@v4
        with:
          name: gpui-preview-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/latch-desktop
            target/release/latch-desktop.exe
          if-no-files-found: error
          retention-days: 14
