name: CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend Checks
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json

      - name: Install dependencies
        working-directory: ./frontend
        run: bun ci

      - name: TypeScript type check
        working-directory: ./frontend
        run: bun run typecheck

      - name: ESLint check
        working-directory: ./frontend
        run: bun run lint

      - name: Frontend tests
        working-directory: ./frontend
        run: bun run test

      - name: Build frontend
        working-directory: ./frontend
        run: bun run build

  backend:
    name: Backend Checks
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Check code formatting
        working-directory: ./frontend/src-tauri
        run: cargo fmt -p latch -- --check

      - name: Run cargo check, test, and clippy
        working-directory: ./frontend/src-tauri
        env:
          LATCH_OAUTH_SECRET: ${{ secrets.CI_LATCH_OAUTH_SECRET }}
        run: |
          cargo check --all-targets --locked
          cargo test --all-targets --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test -p latch-core --features legacy-oauth --locked
          cargo clippy -p latch-core --all-targets --all-features --locked -- -D warnings
        # NOTE: CI_LATCH_OAUTH_SECRET must be set as a GitHub Secret with >= 32 random bytes
        # Generate with: openssl rand -hex 32

  native:
    name: Native Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libfontconfig1-dev libfreetype-dev libssl-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libx11-xcb-dev libgtk-3-dev libayatana-appindicator3-dev
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Check formatting
        run: cargo fmt -p latch-core -p latch-desktop -- --check
      - name: Check native application
        run: cargo check -p latch-desktop --all-targets --locked
      - name: Core tests without legacy OAuth
        run: cargo test -p latch-core --locked
      - name: Native flow tests
        run: cargo test -p latch-desktop --locked
      - name: Strict Clippy
        run: cargo clippy -p latch-core -p latch-desktop --all-targets --locked -- -D warnings
      - name: Build review executable on CI
        run: cargo build -p latch-desktop --locked
      - name: Upload review executable
        uses: actions/upload-artifact@v4
        with:
          name: gpui-preview-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/debug/latch-desktop
            target/debug/latch-desktop.exe
          if-no-files-found: error
          retention-days: 14
