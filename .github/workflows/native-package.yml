name: Native GPUI packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Generate installers after native validation
        type: boolean
        default: true
      sign:
        description: Sign release assets without publishing a release
        type: boolean
        default: false
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''
      package:
        type: boolean
        default: true
      save-cache:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-native-${{ github.event_name }}-${{ github.head_ref || inputs.release-tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Native Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-windows-2025
            platform: windows-x86_64
            formats: nsis
          - os: blacksmith-6vcpu-macos-latest
            platform: macos-aarch64
            formats: app,dmg
          - os: blacksmith-4vcpu-ubuntu-2404
            platform: linux-x86_64
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release-tag || github.sha }}
      - uses: actions/setup-python@v6
        if: inputs.package || inputs.sign || inputs.release-tag != ''
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        id: cache
        with:
          workspaces: '. -> target'
          shared-key: native-ci
          # Only main CI writes the full validation cache; PRs and releases consume it.
          save-if: ${{ inputs.save-cache }}
          cache-bin: false
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libfontconfig1-dev libfreetype-dev libssl-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libx11-xcb-dev libgtk-3-dev libayatana-appindicator3-dev libfuse2
      - name: Check formatting
        run: cargo fmt -p latch-core -p latch-desktop -- --check
      - name: Check native application
        run: cargo check -p latch-desktop --all-targets --locked
      - name: Core tests without legacy OAuth
        run: cargo test -p latch-core --locked
      - name: Native flow tests
        run: cargo test -p latch-desktop --locked
      - name: Historical vault compatibility tests
        run: cargo test -p latch-core --features legacy-oauth --locked
      - name: Strict Clippy
        run: cargo clippy -p latch-core -p latch-desktop --all-targets --locked -- -D warnings
      - name: Strict compatibility Clippy
        run: cargo clippy -p latch-core --all-targets --all-features --locked -- -D warnings
      - name: Build native application on CI
        run: cargo build -p latch-desktop --release --locked
      - name: Upload review executable
        if: inputs.release-tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: gpui-preview-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/latch-desktop
            target/release/latch-desktop.exe
          if-no-files-found: error
          retention-days: 14
      - name: Install pinned packaging tool
        if: inputs.package || inputs.sign || inputs.release-tag != ''
        uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389 # v3
        with:
          tool: cargo-packager@0.11.8
      - name: Verify packaging tool
        if: inputs.package || inputs.sign || inputs.release-tag != ''
        run: cargo packager --version
      - name: Package review application
        if: inputs.package && inputs.release-tag == '' && !inputs.sign
        working-directory: crates/latch-desktop
        run: cargo packager --release --formats ${{ matrix.formats }}
      - name: Package and sign release
        if: inputs.release-tag != '' || inputs.sign
        working-directory: crates/latch-desktop
        shell: bash
        env:
          # Retain the existing secret names and trust key for native updates.
          ENCODED_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ENCODED_SIGNING_KEY" || { echo 'Missing updater signing key'; exit 1; }
          # The existing secret wraps the base64 Minisign key in another base64 layer.
          python -c 'import base64,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "updater.key").write_bytes(base64.b64decode("".join(os.environ["ENCODED_SIGNING_KEY"].split()), validate=True).strip())'
          export CARGO_PACKAGER_SIGN_PRIVATE_KEY="$RUNNER_TEMP/updater.key"
          trap 'rm -f "$CARGO_PACKAGER_SIGN_PRIVATE_KEY"' EXIT
          cargo packager --release --formats ${{ matrix.formats }}
      - name: Stage versioned release downloads
        if: inputs.release-tag != '' || inputs.sign
        run: python scripts/release.py stage target/native-packages target/release-assets --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: inputs.package || inputs.sign || inputs.release-tag != ''
        with:
          name: native-${{ matrix.platform }}
          path: ${{ (inputs.release-tag != '' || inputs.sign) && 'target/release-assets/*' || 'target/native-packages/**' }}
          if-no-files-found: error
          retention-days: 14
      - name: Record cache result
        if: always()
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          SAVE_CACHE: ${{ inputs.save-cache }}
        run: |
          printf '### Native cache\n\nExact hit: `%s`\n\nWriter enabled: `%s`\n' "$CACHE_HIT" "$SAVE_CACHE" >> "$GITHUB_STEP_SUMMARY"
