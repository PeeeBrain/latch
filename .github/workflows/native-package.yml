name: Native GPUI packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
          - os: macos-latest
            formats: app,dmg
          - os: ubuntu-24.04
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libfontconfig1-dev libfreetype-dev libssl-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libx11-xcb-dev libgtk-3-dev libayatana-appindicator3-dev libfuse2
      - name: Native tests
        run: cargo test -p latch-core -p latch-desktop --locked
      - name: Build native application on CI
        run: cargo build -p latch-desktop --release --locked
      - name: Install pinned packaging tool
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Package native application
        working-directory: crates/latch-desktop
        run: cargo packager --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: target/native-packages/**
          if-no-files-found: error
          retention-days: 14

# This produces review artifacts only. Stable publication remains gated on OS
# signing, installer continuity, device-key tests and the legacy OAuth bridge.
# The existing Tauri updater feed must never serve these unvalidated packages.
