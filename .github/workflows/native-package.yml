name: Native GPUI packages

on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign release assets without publishing a release
        type: boolean
        default: false
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''
  pull_request:
    paths:
      - '.github/workflows/native-package.yml'
      - '.github/workflows/release.yml'
      - 'scripts/release.py'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

permissions:
  contents: read

concurrency:
  group: native-packages-${{ github.event_name }}-${{ github.head_ref || inputs.release-tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            formats: nsis
          - os: macos-latest
            platform: macos-aarch64
            formats: app,dmg
          - os: macos-15-intel
            platform: macos-x86_64
            formats: app,dmg
          - os: ubuntu-24.04
            platform: linux-x86_64
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release-tag || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: native-release
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libfontconfig1-dev libfreetype-dev libssl-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev libx11-xcb-dev libgtk-3-dev libayatana-appindicator3-dev libfuse2
      - name: Native tests
        run: cargo test -p latch-core -p latch-desktop --locked
      - name: Build native application on CI
        run: cargo build -p latch-desktop --release --locked
      - name: Install pinned packaging tool
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Package review application
        if: inputs.release-tag == '' && !inputs.sign
        working-directory: crates/latch-desktop
        run: cargo packager --release --formats ${{ matrix.formats }}
      - name: Package and sign release
        if: inputs.release-tag != '' || inputs.sign
        working-directory: crates/latch-desktop
        shell: bash
        env:
          # Retain the existing secret names and trust key for native updates.
          ENCODED_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ENCODED_SIGNING_KEY" || { echo 'Missing updater signing key'; exit 1; }
          # The existing secret wraps the base64 Minisign key in another base64 layer.
          python -c 'import base64,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "updater.key").write_bytes(base64.b64decode("".join(os.environ["ENCODED_SIGNING_KEY"].split()), validate=True).strip())'
          export CARGO_PACKAGER_SIGN_PRIVATE_KEY="$RUNNER_TEMP/updater.key"
          trap 'rm -f "$CARGO_PACKAGER_SIGN_PRIVATE_KEY"' EXIT
          cargo packager --release --formats ${{ matrix.formats }}
      - name: Stage versioned release downloads
        if: inputs.release-tag != '' || inputs.sign
        run: python scripts/release.py stage target/native-packages target/release-assets --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: ${{ (inputs.release-tag != '' || inputs.sign) && 'target/release-assets/*' || 'target/native-packages/**' }}
          if-no-files-found: error
          retention-days: 14
