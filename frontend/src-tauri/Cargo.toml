[package]
name = "latch"
version = "0.2.6"
description = "Latch Password Manager"
authors = ["parthashirolkar"]
license = "MIT"
repository = "https://github.com/parthashirolkar/latch"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
latch-core = { path = "../../crates/latch-core", features = ["legacy-oauth"] }
zeroize = "1.7"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-log = "=2.9.1"
tauri-plugin-global-shortcut = "=2.3.2"
hex = "0.4"
uuid = { version = "1.18", features = ["v4"] }
tauri-plugin-google-auth = "=0.5.1"
tauri-plugin-biometry = "=0.2.8"
tauri-plugin-updater = "=2.11.0"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-process = "=2.3.1"
dotenvy = "0.15"
url = "2.5"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
