[package]
name = "latch"
version = "0.2.6"
description = "Latch Password Manager"
authors = ["parthashirolkar"]
license = "MIT"
repository = "https://github.com/parthashirolkar/latch"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.6.3"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-log = "=2.9.1"
tauri-plugin-global-shortcut = "=2.3.2"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
dirs = "6"
hex = "0.4"
uuid = { version = "1.18", features = ["v4"] }
fuzzy-matcher = "0.3"
jsonwebtoken = "9"
sha2 = "0.10"
pbkdf2 = "0.12"
data-encoding = "2.9"
tauri-plugin-google-auth = "=0.5.1"
tauri-plugin-biometry = "=0.2.8"
tauri-plugin-updater = "=2.11.0"
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-process = "=2.3.1"
dotenvy = "0.15"
zxcvbn = "3.1.0"
sha1 = "0.10.6"
reqwest = { version = "0.12", features = ["rustls-tls"] }
zeroize = { version = "1.7", features = ["derive"] }
url = "2.5"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
totp-lite = "2.0"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"
